<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Smart Campus - Registrations</title>
</head>

<body>

<h1>Course Registration</h1>

<h2>Register Student for a Course</h2>

<form th:action="@{/registrations/save}"
      th:object="${registration}"
      method="post">

    <input type="text"
           th:field="*{studentNumber}"
           placeholder="Student Registration Number"
           required>

    <input type="text"
           th:field="*{courseCode}"
           placeholder="Course Code"
           required>

    <button type="submit">Register Student</button>

</form>

<hr>

<h2>Registered Courses</h2>

<table border="1">

    <thead>
    <tr>
        <th>ID</th>
        <th>Student Number</th>
        <th>Course Code</th>
    </tr>
    </thead>

    <tbody>

    <tr th:each="registration : ${registrations}">

        <td th:text="${registration.id}"></td>
        <td th:text="${registration.studentNumber}"></td>
        <td th:text="${registration.courseCode}"></td>

    </tr>

    </tbody>

</table>

</body>

</html>
