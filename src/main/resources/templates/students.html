<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Smart Campus - Students</title>
</head>

<body>

<h1>Student Management</h1>

<h2>Add New Student</h2>

<form th:action="@{/students/save}" th:object="${student}" method="post">

    <input type="text"
           th:field="*{registrationNumber}"
           placeholder="Registration Number"
           required>

    <input type="text"
           th:field="*{firstName}"
           placeholder="First Name"
           required>

    <input type="text"
           th:field="*{lastName}"
           placeholder="Last Name"
           required>

    <input type="email"
           th:field="*{email}"
           placeholder="Email"
           required>

    <input type="text"
           th:field="*{phone}"
           placeholder="Phone">

    <input type="text"
           th:field="*{program}"
           placeholder="Program">

    <input type="text"
           th:field="*{yearOfStudy}"
           placeholder="Year of Study">

    <button type="submit">Add Student</button>

</form>

<hr>

<h2>Students</h2>

<table border="1">

    <thead>
    <tr>
        <th>ID</th>
        <th>Registration Number</th>
        <th>First Name</th>
        <th>Last Name</th>
        <th>Email</th>
        <th>Phone</th>
        <th>Program</th>
        <th>Year</th>
    </tr>
    </thead>

    <tbody>

    <tr th:each="student : ${students}">

        <td th:text="${student.id}"></td>
        <td th:text="${student.registrationNumber}"></td>
        <td th:text="${student.firstName}"></td>
        <td th:text="${student.lastName}"></td>
        <td th:text="${student.email}"></td>
        <td th:text="${student.phone}"></td>
        <td th:text="${student.program}"></td>
        <td th:text="${student.yearOfStudy}"></td>

    </tr>

    </tbody>

</table>

</body>

</html>
